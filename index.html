<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIZI CORE V-MAX - Nitidez Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        :root { --main-bg: #000; --panel: #0a0a0a; --accent: #fff; --avatar-bot: url('182.png'); }
        body { background: var(--main-bg); color: #fff; font-family: 'Inter', sans-serif; transition: 0.5s; overflow: hidden; }
        .sync { font-family: 'Syncopate', sans-serif; text-transform: uppercase; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-chat { border-left: 3px solid #fff; background: rgba(255,255,255,0.1); }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .fog-effect { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: rgba(255,255,255,0.8); transition: 0.5s; }
        .bot-avatar { background-image: var(--avatar-bot); background-size: cover; background-position: center; }
        input[type="color"] { width: 40px; height: 40px; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <div id="fog" class="fog-effect z-10"></div>

    <div id="login-screen" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-8 rounded-2xl text-center">
            <div class="w-24 h-24 rounded-full mx-auto border-2 border-white mb-4 bot-avatar"></div>
            <h1 class="sync text-2xl mb-6 tracking-widest">Maizi Core</h1>
            <div class="space-y-4">
                <input type="password" id="admin-pass" placeholder="SENHA DE ACESSO (O9123678oi)" class="w-full bg-transparent border border-white/20 p-4 rounded-xl outline-none focus:border-white transition text-center">
                <button onclick="auth()" class="w-full bg-white text-black font-bold p-4 rounded-xl hover:bg-gray-200 transition">ENTRAR NO SISTEMA</button>
                <div class="flex items-center my-4"><div class="flex-1 h-px bg-white/10"></div><span class="px-4 text-xs text-white/40">OU ENTRAR COM</span><div class="flex-1 h-px bg-white/10"></div></div>
                <div class="flex gap-4">
                    <button onclick="socialAuth('Google')" class="flex-1 border border-white/10 p-3 rounded-xl flex justify-center hover:bg-white/5 transition"><img src="https://www.svgrepo.com/show/355037/google-icon.svg" class="w-6"></button>
                    <button onclick="socialAuth('Facebook')" class="flex-1 border border-white/10 p-3 rounded-xl flex justify-center hover:bg-white/5 transition"><img src="https://www.svgrepo.com/show/448224/facebook.svg" class="w-6"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="hidden flex h-screen">
        <aside class="w-20 md:w-64 bg-[#050505] border-r border-white/10 flex flex-col">
            <div class="p-6 text-center border-bottom border-white/5">
                <span class="sync text-xs font-bold tracking-tighter hidden md:block">Database: Sávio</span>
            </div>
            <nav class="flex-1 overflow-y-auto px-2 space-y-2 mt-4" id="chat-list">
                <button onclick="switchChat('Geral')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition active-chat" id="btn-Geral"><span>🌐 Geral</span> <span class="hidden md:block">Maizi Geral</span></button>
                <button onclick="switchChat('Português')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Português"><span>📖 Por</span> <span class="hidden md:block text-left">Português</span></button>
                <button onclick="switchChat('Matemática')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Matemática"><span>🔢 Mat</span> <span class="hidden md:block text-left">Matemática</span></button>
                <button onclick="switchChat('Ciências')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Ciências"><span>🧬 Ciê</span> <span class="hidden md:block text-left">Ciências</span></button>
                <button onclick="switchChat('Geografia')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Geografia"><span>🌍 Geo</span> <span class="hidden md:block text-left">Geografia</span></button>
                <button onclick="switchChat('História')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-História"><span>📜 His</span> <span class="hidden md:block text-left">História</span></button>
                <button onclick="switchChat('Redação')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Redação"><span>✍️ Red</span> <span class="hidden md:block text-left">Redação</span></button>
                <button onclick="switchChat('Frações')" class="w-full p-4 rounded-xl flex items-center gap-3 hover:bg-white/5 transition" id="btn-Frações"><span>🍕 Fra</span> <span class="hidden md:block text-left">Frações</span></button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col relative">
            <header class="p-4 border-b border-white/10 flex justify-between items-center glass z-20">
                <h2 id="current-chat-title" class="sync text-sm tracking-widest">Maizi Geral</h2>
                <div class="flex gap-4">
                    <button onclick="toggleAdmin()" class="text-xs border border-white/20 px-3 py-1 rounded-full">Sávio ADM ⚙️</button>
                    <div class="w-8 h-8 rounded-full bot-avatar"></div>
                </div>
            </header>

            <div id="admin-panel" class="hidden absolute top-[60px] right-4 w-72 glass p-6 rounded-2xl z-20 border-white">
                <h4 class="sync text-xs font-bold mb-4 tracking-wider">Painel do Sávio</h4>
                <p class="text-xs text-green-400 mb-2">● Status: Online</p>
                <p class="text-[10px] text-white/50 mb-4">Mude as configurações da Maizi.</p>
                
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs">Cor do Fundo:</span>
                        <input type="color" id="background-color" value="#000000" onchange="customBackground(this.value)">
                    </div>
                    
                    <div class="space-y-1">
                        <span class="text-xs block">Avatar da Maizi (URL):</span>
                        <input type="text" id="bot-avatar-url" placeholder="URL da imagem (ex: imgur)" class="w-full text-xs bg-transparent border border-white/10 p-2 rounded-lg" onchange="customBotAvatar(this.value)">
                    </div>

                    <div class="flex gap-2 justify-center pt-2">
                        <button onclick="quickTheme('dark')" class="bg-[#111] p-3 rounded-full border border-white/10">⚫</button>
                        <button onclick="quickTheme('light')" class="bg-white p-3 rounded-full">⚪</button>
                    </div>
                </div>
                
                <button onclick="toggleAdmin()" class="absolute top-2 right-2 text-white/50 text-xs">X</button>
            </div>

            <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-6">
                </div>

            <div class="p-6">
                <div class="max-w-4xl mx-auto flex gap-4 glass p-2 rounded-2xl">
                    <input type="text" id="user-input" placeholder="Pergunte sobre a matéria ou peça uma imagem real nítida..." class="flex-1 bg-transparent p-4 outline-none">
                    <button onclick="sendMessage()" class="bg-white text-black p-4 rounded-xl hover:bg-gray-200 transition font-bold">ENVIAR</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentChat = 'Geral';
        const senhaCorreta = "09123678oi";
        let maiziAvatar = '182.png'; // Avatar padrão

        function auth() {
            if(document.getElementById('admin-pass').value === senhaCorreta) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('flex');
                document.documentElement.style.setProperty('--avatar-bot', `url('${maiziAvatar}')`);
            } else { alert("Senha Incorreta"); }
        }

        function socialAuth(type) {
            alert(`Conectando ao ${type}... (Login Simulado com Sucesso)`);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('app').classList.add('flex');
            document.documentElement.style.setProperty('--avatar-bot', `url('${maiziAvatar}')`);
        }

        function switchChat(chat) {
            currentChat = chat;
            document.getElementById('current-chat-title').innerText = `Maizi ${chat}`;
            document.querySelectorAll('#chat-list button').forEach(b => b.classList.remove('active-chat'));
            document.getElementById(`btn-${chat}`).classList.add('active-chat');
            document.getElementById('chat-window').innerHTML = `<div class='text-center text-white/20 text-xs my-4'>Módulo de ${chat} carregado.</div>`;
            document.getElementById('admin-panel').classList.add('hidden'); // Fecha admin se abrir chat
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        // --- Personalização do Painel Admin ---
        function customBackground(color) {
            document.documentElement.style.setProperty('--main-bg', color);
        }

        function customBotAvatar(url) {
            if(url) {
                maiziAvatar = url;
                document.documentElement.style.setProperty('--avatar-bot', `url('${url}')`);
            }
        }

        function quickTheme(mode) {
            const fog = document.getElementById('fog');
            if(mode === 'light') {
                document.documentElement.style.setProperty('--main-bg', '#ffffff');
                document.documentElement.style.setProperty('--text', '#000000');
                document.documentElement.style.setProperty('--accent', '#000000');
                fog.style.opacity = "0.7";
            } else {
                document.documentElement.style.setProperty('--main-bg', '#000000');
                document.documentElement.style.setProperty('--text', '#ffffff');
                document.documentElement.style.setProperty('--accent', '#ffffff');
                fog.style.opacity = "0";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatWin = document.getElementById('chat-window');
            if(!input.value) return;

            const text = input.value;
            chatWin.innerHTML += `<div class="flex justify-end"><div class="bg-white text-black p-4 rounded-2xl max-w-[80%] font-semibold">${text}</div></div>`;
            input.value = "";
            chatWin.scrollTop = chatWin.scrollHeight;

            const t = text.toLowerCase();
            let resposta = "";

            // --- Gerador de Imagens Reais e Nítidas consertado ---
            if(t.includes("gera") || t.includes("imagem") || t.includes("foto") || t.includes("gere")) {
                chatWin.innerHTML += `<div class="flex justify-start"><div class="glass p-4 rounded-2xl max-w-[80%] border-white">🎨 Criando sua imagem real nítida e realista... aguarde.</div></div>`;
                chatWin.scrollTop = chatWin.scrollHeight;

                // Usa Pollinations com parâmetros para forçar realismo e nitidez
                const realPrompt = encodeURIComponent(text) + ", realistic, photorealistic, 8k, ultra-detailed, high definition, sharp focus, nologo";
                const imgUrl = `https://image.pollinations.ai/prompt/${realPrompt}?width=1080&height=1080&seed=${Math.floor(Math.random()*1000)}`;
                
                // Exibir imagem de forma nítida, garantindo que o chat rola para o final ao carregar
                setTimeout(() => {
                    chatWin.innerHTML += `<div class="flex justify-start"><div class="glass p-4 rounded-2xl max-w-[90%] border-white">
                        <img src="${imgUrl}" class="rounded-lg border border-white/20 mb-2 w-full block" onload="document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight">
                        <p class="text-xs text-white/40">Imagem real nítida gerada pela Maizi Core.</p>
                    </div></div>`;
                    chatWin.scrollTop = chatWin.scrollHeight;
                }, 2500);
            } 
            else {
                // Respostas Inteligentes Variadas (O "Cérebro" avançado)
                if(currentChat === 'Matemática' || currentChat === 'Frações') {
                    resposta = "Para resolver esse cálculo matemático, devemos primeiro identificar as variáveis e aplicar a regra de operação inversa. Vamos fazer o passo a passo?";
                } else if(currentChat === 'Redação') {
                    resposta = "Sua ideia para redação é boa! Para uma redação nota 1000, recomendo usar o conectivo 'Outrossim' no início do segundo parágrafo para ligar seus argumentos com fluidez.";
                } else if(currentChat === 'Português') {
                    resposta = "Lembre-se que em português, sujeito e predicado nunca devem ser separados por vírgula. Quer que eu analise a sintaxe da sua frase?";
                } else {
                    resposta = `Sávio, no módulo de ${currentChat}, identifiquei que sua dúvida é fundamental. De acordo com a base de dados de ${currentChat.toLowerCase()}, a resposta correta envolve analisar os fatos de forma lógica. Quer que eu aprofunde?`;
                }

                setTimeout(() => {
                    chatWin.innerHTML += `<div class="flex justify-start"><div class="glass p-4 rounded-2xl max-w-[80%] border-l-4 border-white">${resposta}</div></div>`;
                    chatWin.scrollTop = chatWin.scrollHeight;
                }, 1000);
            }
            chatWin.scrollTop = chatWin.scrollHeight;
        }

        document.getElementById("user-input").addEventListener("keyup", function(e) { if(e.keyCode === 13) sendMessage(); });
    </script>
</body>
    </html>
