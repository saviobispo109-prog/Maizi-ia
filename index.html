<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIZI CORE V-MAX 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --fundo: #050505; --avatar: url('182.png'); }
        body { background: var(--fundo); color: #fff; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .sigla { font-size: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); padding: 2px 4px; border-radius: 4px; margin-right: 8px; }
        .btn-materia { width: 100%; padding: 12px; border-radius: 12px; display: flex; align-items: center; transition: 0.3s; margin-bottom: 5px; }
        .active-mod { background: #fff !important; color: #000 !important; }
        #chat-win::-webkit-scrollbar { width: 4px; }
        #chat-win::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .perfil-ia { background-image: var(--avatar); background-size: cover; background-position: center; border-radius: 50%; }
    </style>
</head>
<body class="h-screen flex">

    <div id="lock" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center">
            <div class="w-20 h-20 perfil-ia mx-auto border-2 border-white mb-4"></div>
            <h2 class="font-bold text-xl mb-6">MAIZI CORE SUPREME</h2>
            <input type="text" id="u" placeholder="Usuário (Sávio)" class="w-full bg-white/5 p-4 rounded-xl mb-3 outline-none border border-white/10 focus:border-white">
            <input type="password" id="p" placeholder="Senha" class="w-full bg-white/5 p-4 rounded-xl mb-6 outline-none border border-white/10 focus:border-white">
            <button onclick="logar()" class="w-full bg-white text-black font-bold p-4 rounded-xl hover:scale-95 transition">ENTRAR</button>
        </div>
    </div>

    <aside class="w-20 md:w-64 bg-black border-r border-white/5 flex flex-col hidden" id="aside">
        <div class="p-6 border-b border-white/5 flex items-center gap-2">
            <div class="w-8 h-8 perfil-ia"></div>
            <span class="font-bold text-xs hidden md:block">MAIZI CORE</span>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
            <button onclick="mudar('Geral')" id="b-Geral" class="btn-materia active-mod"><span class="sigla">GER</span> <span class="hidden md:block">Geral</span></button>
            <button onclick="mudar('Português')" id="b-Português" class="btn-materia text-gray-500"><span class="sigla">POR</span> <span class="hidden md:block">Português</span></button>
            <button onclick="mudar('Matemática')" id="b-Matemática" class="btn-materia text-gray-500"><span class="sigla">MAT</span> <span class="hidden md:block">Matemática</span></button>
            <button onclick="mudar('Redação')" id="b-Redação" class="btn-materia text-gray-500"><span class="sigla">RED</span> <span class="hidden md:block">Redação</span></button>
            <button onclick="mudar('Frações')" id="b-Frações" class="btn-materia text-gray-500"><span class="sigla">FRA</span> <span class="hidden md:block">Frações</span></button>
        </div>
        <div class="p-4"><button onclick="abrirConfig()" class="w-full glass p-3 rounded-xl text-[10px] font-bold">⚙️ CUSTOMIZAR</button></div>
    </aside>

    <main class="flex-1 flex flex-col hidden" id="main">
        <header class="p-5 border-b border-white/5 glass flex justify-between items-center">
            <span id="label" class="font-bold text-sm uppercase tracking-widest text-gray-400">Módulo Geral</span>
            <div class="text-[10px] bg-white/10 px-2 py-1 rounded">SÁVIO ADM</div>
        </header>

        <div id="chat-win" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="p-6">
            <div class="max-w-4xl mx-auto flex gap-2 glass p-2 rounded-2xl">
                <input type="text" id="msg" placeholder="Peça uma imagem realista ou tire uma dúvida..." class="flex-1 bg-transparent p-3 outline-none text-sm">
                <button onclick="enviar()" class="bg-white text-black px-6 py-3 rounded-xl font-bold transition active:scale-90">ENVIAR</button>
            </div>
        </div>
    </main>

    <div id="cfg" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-sm space-y-4">
            <h3 class="font-bold">Personalizar Maizi</h3>
            <input type="color" id="cor" class="w-full h-12 bg-transparent cursor-pointer">
            <input type="text" id="img-url" placeholder="URL da foto da IA" class="w-full bg-white/5 p-3 rounded-xl text-sm border border-white/10">
            <button onclick="salvarCfg()" class="w-full bg-white text-black font-bold p-4 rounded-xl">SALVAR</button>
            <button onclick="abrirConfig()" class="w-full text-xs text-gray-500">FECHAR</button>
        </div>
    </div>

    <script>
        let mod = 'Geral';
        const sHash = "25c1b52f6f4c718b958e4585e1352e8006e88d1891963953e5e463d666d6d63e"; // Hash de 09123678oi

        async function hash(m) {
            const b = new TextEncoder().encode(m);
            const h = await crypto.subtle.digest('SHA-256', b);
            return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
        }

        async function logar() {
            const user = document.getElementById('u').value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const pass = document.getElementById('p').value;
            const pHash = await hash(pass);

            if((user === "savio") && pHash === sHash) {
                document.getElementById('lock').classList.add('hidden');
                document.getElementById('aside').classList.remove('hidden');
                document.getElementById('main').classList.remove('hidden');
            } else { alert("Acesso Negado. Verifique usuário e senha."); }
        }

        function mudar(n) {
            mod = n;
            document.getElementById('label').innerText = `Módulo ${n}`;
            document.querySelectorAll('.btn-materia').forEach(b => b.classList.remove('active-mod', 'text-white'));
            document.getElementById(`b-${n}`).classList.add('active-mod');
        }

        function abrirConfig() { document.getElementById('cfg').classList.toggle('hidden'); }

        function salvarCfg() {
            const c = document.getElementById('cor').value;
            const u = document.getElementById('img-url').value;
            if(c) document.documentElement.style.setProperty('--fundo', c);
            if(u) document.documentElement.style.setProperty('--avatar', `url('${u}')`);
            abrirConfig();
        }

        async function enviar() {
            const input = document.getElementById('msg');
            const win = document.getElementById('chat-win');
            if(!input.value) return;

            const t = input.value;
            win.innerHTML += `<div class="flex justify-end"><div class="bg-white text-black p-4 rounded-2xl rounded-tr-none text-sm font-bold max-w-[80%]">${t}</div></div>`;
            input.value = "";
            win.scrollTop = win.scrollHeight;

            if(t.toLowerCase().includes("imagem") || t.toLowerCase().includes("foto")) {
                const p = encodeURIComponent(t + ", ultra-realistic, photorealistic, 8k, highly detailed, sharp focus, cinema lighting");
                const url = `https://image.pollinations.ai/prompt/${p}?width=1080&height=1080&nologo=true&seed=${Math.random()}`;
                
                win.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 perfil-ia"></div><div class="glass p-2 rounded-2xl max-w-[90%]"><img src="${url}" class="rounded-xl w-full" onerror="this.src='https://via.placeholder.com/1080?text=Erro+ao+Carregar+Imagem+Nítida'"></div></div>`;
            } else {
                setTimeout(() => {
                    win.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 perfil-ia"></div><div class="glass p-4 rounded-2xl text-sm">Entendido, Sávio. No módulo ${mod}, meu processamento está 100% focado em você. Como posso ajudar agora?</div></div>`;
                    win.scrollTop = win.scrollHeight;
                }, 600);
            }
            win.scrollTop = win.scrollHeight;
        }
    </script>
</body>
</html>
