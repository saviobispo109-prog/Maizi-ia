<!-- Estrutura de Login/Cadastro da MAIZI IA -->
<div id="auth-container" style="background: rgba(26, 26, 26, 0.9); padding: 20px; border-radius: 15px; color: white; font-family: sans-serif; max-width: 400px; margin: auto; backdrop-filter: blur(10px); border: 1px solid #333;">
    <h2 id="title" style="text-align: center;">MAIZI IA - Login</h2>
    
    <div id="form-body">
        <input type="text" id="username" placeholder="Nome de Usuário" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; background: #333; color: white;">
        
        <div style="position: relative;">
            <input type="password" id="password" placeholder="Sua Senha" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; background: #333; color: white;">
        </div>

        <button onclick="autenticar()" style="width: 100%; padding: 12px; border-radius: 5px; border: none; background: #fff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s;">Entrar no Sistema</button>
        
        <p id="msg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; text-align: center;"></p>
    </div>
</div>

<script>
function autenticar() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    
    // A SENHA MESTRE QUE VOCÊ DEFINIU
    const masterPass = "09123678oi";

    if (user === "" || pass === "") {
        msg.innerText = "Preencha todos os campos!";
        return;
    }

    if (pass === masterPass) {
        msg.style.color = "#00ff88";
        msg.innerText = "Bem-vindo, Sávio! Acessando Painel ADM...";
        // Aqui você redireciona para o painel secreto
        setTimeout(() => { window.location.href = "painel_adm.html"; }, 1500);
    } else {
        msg.style.color = "#fff";
        msg.innerText = "Login realizado como Usuário Padrão.";
        // Aqui redireciona para a IA normal
        setTimeout(() => { window.location.href = "chat_geral.html"; }, 1500);
    }
}
</script>
