<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIZI IA - Premium</title>
    <style>
        :root { --bg: #000; --text: #fff; --accent: #fff; --card: #1a1a1a; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; transition: 0.5s; }
        
        /* Efeito de Névoa para o tema Branco */
        .fog { position: fixed; width: 100%; height: 100%; pointer-events: none; opacity: 0; background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png'); transition: 0.5s; }

        /* Tela de Login */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input[type="password"], input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; margin: 10px; width: 250px; outline: none; }

        /* Layout Principal */
        #app { display: none; height: 100vh; flex-direction: column; }
        .header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .header img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #fff; object-fit: cover; }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bot { background: var(--card); align-self: flex-start; border: 1px solid #333; }
        .user { background: #fff; color: #000; align-self: flex-end; font-weight: 600; }
        .gen-img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #444; display: block; }

        .controls { padding: 15px; background: #000; border-top: 1px solid #333; display: flex; gap: 10px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-send { background: #fff; color: #000; }
        .btn-send:active { transform: scale(0.95); }
        
        /* Painel Admin */
        #admin-panel { display: none; position: fixed; top: 60px; right: 10px; background: #111; border: 1px solid #fff; padding: 15px; border-radius: 8px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .admin-btn { background: #333; color: white; font-size: 12px; padding: 5px 10px; margin-top: 5px; width: 100%; }
    </style>
</head>
<body>
    <div class="fog" id="fog"></div>

    <div id="login-screen">
        <img src="182.png" width="80" style="border-radius: 50%; margin-bottom: 20px; border: 2px solid #fff;">
        <h2 style="letter-spacing: 2px;">ACESSO MAIZI</h2>
        <input type="password" id="pass" placeholder="Digite sua senha secreta">
        <button class="btn-send" onclick="checkLogin()">CONECTAR</button>
    </div>

    <div id="app">
        <div class="header">
            <div onclick="toggleAdmin()" style="cursor: pointer; font-size: 14px;">⚙️ PAINEL</div>
            <div id="theme-selector">
                <button onclick="setTheme('dark')" style="background: none; padding: 5px;">⚫</button>
                <button onclick="setTheme('light')" style="background: none; padding: 5px;">⚪</button>
            </div>
            <img src="182.png" alt="Avatar Maizi">
        </div>

        <div id="admin-panel">
            <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #333;">Admin: Sávio</h4>
            <p style="font-size: 11px; color: #888;">Fundo Personalizado:</p>
            <input type="text" id="custom-bg" placeholder="#1a1a1a" style="width: 100px; font-size: 12px;" onchange="customTheme(this.value)">
            <button class="admin-btn" onclick="location.reload()">Reiniciar Sistema</button>
        </div>

        <div id="chat">
            <div class="msg bot">Sistema MAIZI inicializado. Modo Premium ativado. O que vamos criar ou estudar hoje, Sávio?</div>
        </div>

        <div class="controls">
            <input type="text" id="input" placeholder="Dúvida ou 'Gere uma imagem de...'">
            <button class="btn-send" onclick="handleInput()">➤</button>
        </div>
    </div>

    <script>
        // Verificação de Senha Atualizada
        function checkLogin() {
            const senhaDigitada = document.getElementById('pass').value;
            if(senhaDigitada === "09123678oi") { 
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
            } else { 
                alert("Acesso Negado. Senha incorreta."); 
            }
        }

        // Sistema de Temas
        function setTheme(mode) {
            const fog = document.getElementById('fog');
            if(mode === 'light') {
                document.documentElement.style.setProperty('--bg', '#ffffff');
                document.documentElement.style.setProperty('--text', '#000000');
                document.documentElement.style.setProperty('--card', '#f2f2f2');
                fog.style.opacity = "0.6";
            } else {
                document.documentElement.style.setProperty('--bg', '#000000');
                document.documentElement.style.setProperty('--text', '#ffffff');
                document.documentElement.style.setProperty('--card', '#1a1a1a');
                fog.style.opacity = "0";
            }
        }

        function customTheme(color) {
            document.documentElement.style.setProperty('--bg', color);
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // Lógica da IA e Gerador de Imagens Reais
        async function handleInput() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if(!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const baixa = text.toLowerCase();

            // Comando de Imagem Real
            if(baixa.includes("gere") || baixa.includes("gera") || baixa.includes("imagem") || baixa.includes("desenhe")) {
                chat.innerHTML += `<div class="msg bot">🎨 Criando imagem real baseada no seu pedido...</div>`;
                chat.scrollTop = chat.scrollHeight;
                
                const promptFinal = encodeURIComponent(text);
                const imgUrl = `https://image.pollinations.ai/prompt/${promptFinal}?width=1080&height=1080&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;
                
                setTimeout(() => {
                    chat.innerHTML += `<div class="msg bot">Aqui está sua criação:<br><img src="${imgUrl}" class="gen-img" onload="document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight"></div>`;
                }, 2500);
            } 
            else {
                // Respostas de Estudo/Gerais Variadas
                const respostas = [
                    "Excelente ponto. Se analisarmos profundamente, isso se conecta com a base do que estamos estudando.",
                    "Processando... De acordo com meus módulos de aprendizado, a melhor forma de entender isso é dividindo o problema em partes.",
                    "Interessante! Você quer que eu explique isso de uma forma mais técnica ou mais simples?",
                    "Como sua assistente premium, verifiquei que este tópico é recorrente. Quer uma lista de exercícios?",
                    "Entendido, Sávio. Vamos focar na solução. Aqui está o que eu sugiro..."
                ];
                const r = respostas[Math.floor(Math.random() * respostas.length)];
                
                setTimeout(() => {
                    chat.innerHTML += `<div class="msg bot">${r}</div>`;
                    chat.scrollTop = chat.scrollHeight;
                }, 1000);
            }
        }

        // Enviar com a tecla Enter do teclado
        document.getElementById("input").addEventListener("keyup", function(event) {
            if (event.keyCode === 13) { handleInput(); }
        });
    </script>
</body>
</html>
